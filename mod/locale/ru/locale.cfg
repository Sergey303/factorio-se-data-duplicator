[mod-name]
se-data-duplicator=SE Data Duplicator

[mod-description]
se-data-duplicator=Копирование карт данных SE в суперкомпьютерах с риском получить две мусорные карты.

[se-data-duplicator]
copy-name=Копирование: __1__
copy-description=Тратятся заполненная и чистая карты и термофлюид −100°C. Выход жидкости +25°C. Вероятность получить две мусорные карты: __1__%.

[mod-setting-name]
se-data-duplicator-failure-percent=Вероятность порчи данных (%)
se-data-duplicator-craft-seconds=Время копирования (сек.)
se-data-duplicator-coolant-amount=Расход термофлюида за копию
se-data-duplicator-include-probes=Включать данные зондов

[mod-setting-description]
se-data-duplicator-failure-percent=При ошибке расходуются обе исходные карты и создаются две мусорные. Жидкость возвращается всегда.
se-data-duplicator-craft-seconds=Время изготовления до учёта скорости машины и модулей.
se-data-duplicator-coolant-amount=Количество термофлюида −100°C на входе и +25°C на выходе.
se-data-duplicator-include-probes=Дополнительно создавать рецепты для данных зондов. Если исходного рецепта нет, разблокировать по поздним технологиям.
