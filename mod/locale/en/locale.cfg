[mod-name]
se-data-duplicator=SE Data Duplicator

[mod-description]
se-data-duplicator=Duplicate data cards in Space Exploration supercomputers. Each attempt can produce two junk cards instead.

[se-data-duplicator]
copy-name=Copy __1__
copy-description=Consumes one filled card, one blank card and -100°C cold thermofluid. Returns +25°C thermofluid. Chance of making two junk cards: __1__%.

[mod-setting-name]
se-data-duplicator-failure-percent=Copying failure chance (%)
se-data-duplicator-craft-seconds=Copy duration (seconds)
se-data-duplicator-coolant-amount=Thermofluid per copy
se-data-duplicator-include-probes=Include probe data cards (balance option)
se-data-duplicator-tiered-supercomputers=Require higher-tier supercomputers for advanced data
se-data-duplicator-include-unknown-cards=Allow unknown new SE data cards

[mod-setting-description]
se-data-duplicator-failure-percent=If copying fails, both input cards are consumed and two junk data cards are created. Does not affect thermofluid return.
se-data-duplicator-craft-seconds=Crafting duration before machine speed modifiers.
se-data-duplicator-coolant-amount=Cold -100°C thermofluid consumed and normal +25°C thermofluid produced per attempt.
se-data-duplicator-include-probes=Disabled by default for game balance. Probe data is created in bulk by rocket launches, so duplication can bypass launching more probes.

se-data-duplicator-tiered-supercomputers=When enabled, later research data needs a more advanced supercomputer. Disabled by default to preserve existing factories.
se-data-duplicator-include-unknown-cards=Opt in to copying unfamiliar SE data items added by future game mods or updates; they must belong to a data subgroup and have a primary recipe and safe unlock.
